<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video to SRT</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6860;
    --line: #dedbd3; --accent: #1f6f5c; --accent-ink: #ffffff; --err: #b3261e;
    --code: #f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1e1c; --ink: #ecebe6; --muted: #9c998f;
      --line: #34332f; --accent: #4fb89c; --accent-ink: #0d1f1a; --err: #f2867e;
      --code: #262522;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 14px;
    background: var(--panel); padding: 40px 20px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop strong { display: block; font-size: 18px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .drop input { display: none; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  label.opt { color: var(--muted); font-size: 14px; }
  select {
    font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button, a.btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none;
  }
  button:disabled { opacity: .45; cursor: default; }
  .status {
    margin-top: 24px; padding: 16px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--line); display: none;
  }
  .status.show { display: block; }
  .status .err { color: var(--err); white-space: pre-wrap; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre {
    background: var(--code); border-radius: 8px; padding: 12px; font-size: 13px;
    max-height: 280px; overflow: auto; margin: 14px 0 0; white-space: pre-wrap;
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Video to SRT</h1>
  <p class="sub">Drop an English MP4 and get Shorts/Reels-ready subtitles to import into CapCut. Everything runs on this Mac.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".mp4,video/mp4">
    <strong id="dropTitle">Drop an MP4 here</strong>
    <span id="dropHint">or click to choose a file</span>
  </label>

  <div class="row">
    <label class="opt" for="layout">Video</label>
    <select id="layout">
      <option value="vertical" selected>Shorts / Reels (vertical)</option>
      <option value="auto">Auto-detect</option>
      <option value="horizontal">Horizontal (YouTube)</option>
    </select>
    <label class="opt" for="maxWords">Caption length</label>
    <select id="maxWords">
      <option value="">Auto</option>
      <option value="3">Short (3 words)</option>
      <option value="5">Medium (5 words)</option>
      <option value="8">Long (8 words)</option>
    </select>
    <button id="go" disabled>Generate subtitles</button>
  </div>

  <div class="status" id="status"></div>

  <p class="hint">In CapCut: Text → Local captions → Import, then pick the .srt file.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), fileInput = $("file"), go = $("go"), statusBox = $("status");
  let chosen = null, busy = false;

  const LABELS = {
    "queued": "Waiting to start…",
    "extracting": "Extracting audio…",
    "downloading-model": "Downloading the speech model (one-time, ~1.6 GB)…",
    "transcribing": "Transcribing speech…",
  };

  function choose(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".mp4")) {
      show(`<div class="err">Only .mp4 files are supported. “${escapeHtml(file.name)}” isn't one.</div>`);
      chosen = null; go.disabled = true; return;
    }
    chosen = file;
    $("dropTitle").textContent = file.name;
    $("dropHint").textContent = `${(file.size / 1048576).toFixed(1)} MB · click to change`;
    go.disabled = busy;
    statusBox.classList.remove("show");
  }

  fileInput.addEventListener("change", () => choose(fileInput.files[0]));
  ["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (ev) => choose(ev.dataTransfer.files[0]));

  function show(html) { statusBox.innerHTML = html; statusBox.classList.add("show"); }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
  function fmt(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m ? `${m}m ${s}s` : `${s}s`; }

  go.addEventListener("click", async () => {
    if (!chosen) return;
    busy = true; go.disabled = true;
    show(`<span class="spinner"></span>Uploading…`);
    const body = new FormData();
    body.append("file", chosen);
    body.append("layout", $("layout").value);
    if ($("maxWords").value) body.append("max_words", $("maxWords").value);
    try {
      const res = await fetch("/api/jobs", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Upload failed.");
      poll(data.id);
    } catch (e) {
      finish(`<div class="err">${escapeHtml(e.message)}</div>`);
    }
  });

  async function poll(id) {
    try {
      const res = await fetch(`/api/jobs/${id}`);
      const j = await res.json();
      if (!res.ok) throw new Error(j.detail || "Lost track of the job.");
      if (j.status === "done") {
        finish(`<strong>Done</strong> — ${j.captions} captions in ${fmt(j.elapsed)}.
          <div class="row"><a class="btn" href="/api/jobs/${id}/srt">Download .srt</a></div>
          <pre>${escapeHtml(j.preview || "")}${j.preview && j.preview.length >= 1200 ? "\n…" : ""}</pre>`);
        return;
      }
      if (j.status === "error") { finish(`<div class="err">${escapeHtml(j.error || "Something went wrong.")}</div>`); return; }
      show(`<span class="spinner"></span>${LABELS[j.status] || j.status} <span style="color:var(--muted)">${fmt(j.elapsed)}</span>`);
      setTimeout(() => poll(id), 1000);
    } catch (e) {
      finish(`<div class="err">${escapeHtml(e.message)}</div>`);
    }
  }

  function finish(html) { show(html); busy = false; go.disabled = !chosen; }
</script>
</body>
</html>
